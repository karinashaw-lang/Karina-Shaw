name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate-corpus:
    name: Corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_corpus.py
      - name: Check tiers.json is up to date
        run: python3 tools/tiering.py --check
      - name: Check the citation index is up to date
        run: python3 tools/build_citation_index.py --check
      - name: Check the data inventory is up to date
        run: python3 tools/generate_data_inventory.py --check
      - name: Copy lint (advisory/enforcement-claim phrasing in app copy)
        run: python3 lint/copy_lint.py
      - name: Test the tooling itself
        run: |
          python3 tests/merge_guard/test_merge_guard.py -v
          python3 tests/validate_corpus/test_showif.py -v
          python3 tests/validate_corpus/test_shared_fields.py -v
          python3 tests/validate_corpus/test_advisory_lint.py -v
          python3 tests/validate_corpus/test_include_if.py -v
          python3 tests/validate_corpus/test_staleness.py -v
          python3 tests/tiering/test_tiering.py -v
          python3 tests/tiering/test_promotion_report.py -v
          python3 tests/verifier/test_verifier.py -v
          python3 tests/verifier/test_triage.py -v
          python3 tests/tools/test_build_citation_index.py -v
          python3 tests/watcher/test_watcher.py -v
          python3 tests/tools/test_recheck_all_resume.py -v
          python3 tests/tools/test_recheck_findings.py -v
          python3 tests/validate_corpus/test_search_data.py -v
          python3 tests/validate_corpus/test_filing_next_steps.py -v
          python3 tests/tools/test_generate_seo_pages.py -v
          python3 tests/lint/test_copy_lint.py -v
          python3 tests/tools/test_generate_data_inventory.py -v
          python3 tests/tools/test_corpus_snapshot.py -v
      - name: Generate and validate SEO pages
        run: |
          python3 tools/generate_seo_pages.py
          python3 tools/validate_seo_pages.py
      - name: Promotion report
        run: python3 tools/promotion_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

  merge-guard:
    name: Merge guard
    # Pull requests only. merge_guard.py exists for one specific failure
    # mode, documented in tools/README.md: a union-merge of a worker
    # branch resolves conflicts in the two large JSON arrays by keeping
    # "ours" for anything with a matching id, which silently reverts an
    # edit to a pre-existing clause/document that happened on the other
    # side, with no conflict reported. That is a question about merging
    # two branches, so it's only meaningful comparing a PR's branch
    # against the base it would merge into.
    #
    # A direct push is not a merge, and this project's own history is
    # full of legitimate direct commits that edit existing clause or
    # document content on purpose (every citation fix is exactly that) —
    # tools/README.md itself describes making corpus-wide corrections via
    # direct push as the normal, preferred path. Running this guard
    # against "the previous commit" on every push would flag every one of
    # those as a failure, which is the guard correctly doing its literal
    # job on a question CI should not have been asking it on a push.
    # (Found exactly this gap when a legitimate single-field fix in the
    # commit that added this job tripped the push-triggered version of
    # this check — see git history around that commit for the real
    # example.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - run: python3 tools/merge_guard.py "origin/${{ github.base_ref }}"

  regression:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: validate-corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Dependency vulnerability scan
        # Phase 9.4. high/critical only -- a moderate finding in a
        # devDependency used only to run tests (axe-core, playwright,
        # jszip, mammoth, pdf-parse -- none of them ship to a real
        # visitor's browser) isn't worth blocking every push over; a
        # real exploitable one is.
        run: npm audit --audit-level=high
      - name: Run test_analytics_report.js
        run: node tests/tools/test_analytics_report.js
      - name: Run test_ingest_feedback_findings.js
        run: node tests/tools/test_ingest_feedback_findings.js
      - name: Run test_error_report_summary.js
        run: node tests/tools/test_error_report_summary.js
      - name: Run contract_matcher unit tests
        run: node tests/contract_matcher/test_contract_matcher.js
      - name: Run eval_contract_reader.js
        run: node tools/eval_contract_reader.js
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup python3 -m http.server 8933 > server.log 2>&1 &
          disown
      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8933/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "server never came up" >&2
          exit 1
      - name: Run regression.js
        run: set -o pipefail; node tools/regression.js | tee regression.log
      - name: Run golden.js
        run: set -o pipefail; node tests/golden/golden.js | tee golden.log
      - name: Run wizard_regression.js
        run: set -o pipefail; node tools/wizard_regression.js | tee wizard-regression.log
      - name: Run wizard_unit.js
        run: set -o pipefail; node tests/wizard/wizard_unit.js | tee wizard-unit.log
      - name: Run golden_search.js
        run: set -o pipefail; node tests/search/golden_search.js | tee golden-search.log
      - name: Run intake_coverage.js
        run: set -o pipefail; node tests/search/intake_coverage.js | tee intake-coverage.log
      - name: Run related_coverage.js
        run: set -o pipefail; node tests/search/related_coverage.js | tee related-coverage.log
      - name: Run performance_budget.js
        run: set -o pipefail; node tests/performance/performance_budget.js | tee performance-budget.log
      - name: Run pdf_golden.js
        run: set -o pipefail; node tests/pdf/pdf_golden.js | tee pdf-golden.log
      - name: Run docx_golden.js
        run: set -o pipefail; node tests/docx/docx_golden.js | tee docx-golden.log
      - name: Run versioning.js
        run: set -o pipefail; node tests/library/versioning.js | tee versioning.log
      - name: Run consistency.js
        run: set -o pipefail; node tests/library/consistency.js | tee consistency.log
      - name: Run filing next_steps.js
        run: set -o pipefail; node tests/filing/next_steps.js | tee filing-next-steps.log
      - name: Run sign_page.js
        run: set -o pipefail; node tests/share/sign_page.js | tee sign-page.log
      - name: Run axe_check.js
        run: set -o pipefail; node tests/accessibility/axe_check.js | tee axe-check.log
      - name: Run error_reporting.js
        run: set -o pipefail; node tests/error_reporting/error_reporting.js | tee error-reporting.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-and-golden-logs
          path: |
            regression.log
            golden.log
            wizard-regression.log
            wizard-unit.log
            golden-search.log
            intake-coverage.log
            performance-budget.log
            related-coverage.log
            axe-check.log
            pdf-golden.log
            docx-golden.log
            sign-page.log
            versioning.log
            consistency.log
            filing-next-steps.log
            error-reporting.log
          if-no-files-found: warn

  deploy-staging:
    name: Deploy to staging (Supabase)
    runs-on: ubuntu-latest
    needs: validate-corpus
    # Phase 9.3: "CI deploys to staging on merge; production deploy is
    # manual." Only on a push to the repo's actual default branch, not
    # every feature-branch push -- a merge, not every commit on the way
    # to one. Does nothing (and doesn't fail) until the project owner
    # adds SUPABASE_ACCESS_TOKEN and SUPABASE_STAGING_PROJECT_REF as
    # repo secrets -- neither exists yet, since a Supabase personal
    # access token isn't something this session can generate or should
    # hold; see DECISIONS.md for exactly what to add and why. This
    # entire job is therefore unverified from this sandbox: written and
    # reasoned through, not run, same as every secrets-gated step in
    # this project (tests/auth_roundtrip.js and friends).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
      - name: Check staging credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN/SUPABASE_STAGING_PROJECT_REF not set -- staging deploy skipped. See DECISIONS.md, Phase 9.3, for what to add."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: latest
      - name: Push migrations to staging
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy edge functions to staging
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Phase 9.4: "confirm no secrets in git history." A one-time full
      # scan of all 1085 commits (gitleaks + detect-secrets,
      # cross-checked, zero real findings -- see DECISIONS.md for the
      # 6 heuristic false positives both tools raised and why each one
      # is clearly not a secret) already confirmed the history is
      # clean as of this phase. This job is the ongoing half: catches
      # a NEW secret in any future push, same gate every other check
      # in this file already runs on every commit.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
