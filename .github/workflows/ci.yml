name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate-corpus:
    name: Corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_corpus.py
      - name: Check tiers.json is up to date
        run: python3 tools/tiering.py --check
      - name: Check the citation index is up to date
        run: python3 tools/build_citation_index.py --check
      - name: Test the tooling itself
        run: |
          python3 tests/merge_guard/test_merge_guard.py -v
          python3 tests/validate_corpus/test_showif.py -v
          python3 tests/validate_corpus/test_shared_fields.py -v
          python3 tests/validate_corpus/test_advisory_lint.py -v
          python3 tests/validate_corpus/test_include_if.py -v
          python3 tests/validate_corpus/test_staleness.py -v
          python3 tests/tiering/test_tiering.py -v
          python3 tests/tiering/test_promotion_report.py -v
          python3 tests/verifier/test_verifier.py -v
          python3 tests/verifier/test_triage.py -v
          python3 tests/tools/test_build_citation_index.py -v
          python3 tests/watcher/test_watcher.py -v
          python3 tests/tools/test_recheck_all_resume.py -v
          python3 tests/tools/test_recheck_findings.py -v
          python3 tests/validate_corpus/test_search_data.py -v
      - name: Promotion report
        run: python3 tools/promotion_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

  merge-guard:
    name: Merge guard
    # Pull requests only. merge_guard.py exists for one specific failure
    # mode, documented in tools/README.md: a union-merge of a worker
    # branch resolves conflicts in the two large JSON arrays by keeping
    # "ours" for anything with a matching id, which silently reverts an
    # edit to a pre-existing clause/document that happened on the other
    # side, with no conflict reported. That is a question about merging
    # two branches, so it's only meaningful comparing a PR's branch
    # against the base it would merge into.
    #
    # A direct push is not a merge, and this project's own history is
    # full of legitimate direct commits that edit existing clause or
    # document content on purpose (every citation fix is exactly that) —
    # tools/README.md itself describes making corpus-wide corrections via
    # direct push as the normal, preferred path. Running this guard
    # against "the previous commit" on every push would flag every one of
    # those as a failure, which is the guard correctly doing its literal
    # job on a question CI should not have been asking it on a push.
    # (Found exactly this gap when a legitimate single-field fix in the
    # commit that added this job tripped the push-triggered version of
    # this check — see git history around that commit for the real
    # example.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - run: python3 tools/merge_guard.py "origin/${{ github.base_ref }}"

  regression:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: validate-corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup python3 -m http.server 8933 > server.log 2>&1 &
          disown
      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8933/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "server never came up" >&2
          exit 1
      - name: Run regression.js
        run: set -o pipefail; node tools/regression.js | tee regression.log
      - name: Run golden.js
        run: set -o pipefail; node tests/golden/golden.js | tee golden.log
      - name: Run wizard_regression.js
        run: set -o pipefail; node tools/wizard_regression.js | tee wizard-regression.log
      - name: Run wizard_unit.js
        run: set -o pipefail; node tests/wizard/wizard_unit.js | tee wizard-unit.log
      - name: Run golden_search.js
        run: set -o pipefail; node tests/search/golden_search.js | tee golden-search.log
      - name: Run intake_coverage.js
        run: set -o pipefail; node tests/search/intake_coverage.js | tee intake-coverage.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-and-golden-logs
          path: |
            regression.log
            golden.log
            wizard-regression.log
            wizard-unit.log
            golden-search.log
            intake-coverage.log
          if-no-files-found: warn
