<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Phase 9.4: narrower than index.html's CSP -- this page has no
       vendored PDF/.docx libraries and no Worker, just config.js,
       sign.js's own plain fetch() to the two share edge functions,
       and Google Fonts via styles.css. See index.html's own CSP
       comment and DECISIONS.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self';" />
  <title>Sign — Groundtruth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="wordmark">Ground<span>truth</span></div>
    </div>
    <section class="screen active" id="screen-sign">
      <h1 tabindex="-1">Review and sign</h1>
      <div id="sign-content">Loading…</div>
    </section>
    <footer class="legal-footer-nav" aria-label="Legal pages">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </footer>
  </div>
  <!-- A deliberately small, separate page: a signer has no account and
       no reason to load the full 740-document corpus app.js pulls in
       just to see one document someone shared with them. See
       DECISIONS.md, Phase 7.5. -->
  <script src="config.js"></script>
  <script src="sign.js"></script>
</body>
</html>
